<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReqRadar</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%232563eb"/><g fill="none" stroke="white" stroke-linecap="round"><circle cx="32" cy="32" r="20" stroke-width="5" stroke-dasharray="76 18"/><circle cx="32" cy="32" r="11" stroke-width="5" stroke-dasharray="40 12"/><path d="M32 32 19 19" stroke-width="6"/></g><g fill="white"><circle cx="32" cy="32" r="4"/><circle cx="46" cy="22" r="4"/><circle cx="27" cy="50" r="4"/></g></svg>' />
    <script>
      (() => {
        const stored = localStorage.getItem("reqradar-theme") || "system";
        const dark = stored === "dark" || (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
